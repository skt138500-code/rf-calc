# Temporary test: can a GitHub runner read YouTube channel feeds and captions? Writes counts only.
name: yt-probe
on:
  push:
    branches: [yt-probe]
    paths: ['english/tools/yt_probe.py', '.github/workflows/yt-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q youtube-transcript-api yt-dlp
      - run: python3 english/tools/yt_probe.py > probe-result.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe-result.txt && git commit -q -m "probe result" && git push -q origin HEAD:yt-probe
